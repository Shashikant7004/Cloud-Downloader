<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Armor - Secure Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-bottom: 5px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .logs-box {
            margin-top: 20px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            display: none;
        }
        .success { color: #4ade80; }
        .info { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ Cloud Armor</h2>
        <p>Real-time Secure File Downloader & Antivirus Scanner</p>
        
        <input type="text" id="fileUrl" placeholder="Direct file ya APK ka link yahan dalein...">
        <button type="button" onclick="startProcess()">Run on GitHub Actions</button>
        
        <div id="logsBox" class="logs-box">
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        function startProcess() {
            const urlInput = document.getElementById('fileUrl');
            const logsBox = document.getElementById('logsBox');
            const logContent = document.getElementById('logContent');
            const url = urlInput.value.trim();

            if (!url) {
                alert('Pehle link toh enter karo!');
                return;
            }

            logsBox.style.display = 'block';
            logContent.innerHTML = '<div class="log-item info">🔄 GitHub par redirect ho raha hai...</div>';

            // Aapke GitHub Actions workflow ka direct page
            const workflowUrl = 'https://github.com/shashikant7004/Cloud-Downloader/actions/workflows/download.yml';

            setTimeout(() => {
                logContent.innerHTML += '<div class="log-item success">✅ Click "Run workflow", paste link & start!</div>';
                window.open(workflowUrl, '_blank');
            }, 1000);
        }
    </script>
</body>
</html>
