<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Armor - Secure Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { margin-bottom: 5px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
        button {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .logs-box {
            margin-top: 20px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            max-height: 180px;
            overflow-y: auto;
            display: none;
        }
        .log-item { margin: 6px 0; display: flex; align-items: center; gap: 8px; word-break: break-all; }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #38bdf8;
            border-top: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ Cloud Armor</h2>
        <p>Real-time Secure File Downloader & Antivirus Scanner</p>
        
        <input type="text" id="fileUrl" placeholder="Direct file ya APK ka link yahan dalein...">
        <button id="actionBtn" type="button" onclick="startProcess()">Start Secure Scan</button>
        
        <div id="logsBox" class="logs-box">
            <div id="logContent"></div>
        </div>
    </div>

    <script>
        async function startProcess() {
            const urlInput = document.getElementById('fileUrl');
            const btn = document.getElementById('actionBtn');
            const logsBox = document.getElementById('logsBox');
            const logContent = document.getElementById('logContent');

            const url = urlInput.value.trim();

            if (!url) {
                alert('Pehle link toh enter karo!');
                return;
            }

            btn.disabled = true;
            logsBox.style.display = 'block';
            logContent.innerHTML = '<div class="log-item"><div class="spinner"></div> Secure server par request bhej rahe hain...</div>';

            try {
                // Vercel Serverless Function ko call kar rahe hain (No token exposed on client)
                const response = await fetch('/api/trigger', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Server trigger fail ho gaya');
                }

                logContent.innerHTML = '<div class="log-item"><div class="spinner"></div> 🚀 Scan & Download queue mein start ho gaya hai...</div>';
                
                // Thoda wait karke success message dikha do
                setTimeout(() => {
                    logContent.innerHTML += '<div class="log-item success">✅ Process successfully trigger ho gaya! GitHub Actions check karein.</div>';
                    btn.disabled = false;
                }, 4000);

            } catch (err) {
                logContent.innerHTML = `<div class="log-item error">❌ Error: ${err.message}</div>`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
