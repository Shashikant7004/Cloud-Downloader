name: Cloud Universal Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link dalen (YouTube, Insta, APK, PDF, etc.)'
        required: true
        type: string
      quality:
        description: 'Quality (Sirf Videos ke liye)'
        required: true
        default: 'best'
        type: choice
        options:
          - 'best'
          - '4k'
          - '1080p'
          - '720p'
          - 'audio-only'

jobs:
  Secure-Download:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment & Install Tools
        run: |
          sudo apt-get update
          # Yahan humne 'nodejs' add kar diya hai taaki YouTube ka JS puzzle solve ho sake
          sudo apt-get install -y ffmpeg clamav curl nodejs
          pip install --upgrade yt-dlp
          sudo freshclam || true

      - name: Download Media / File (Anti-Bot & JS Solver Enabled)
        id: download_step
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          
          mkdir downloaded_files
          cd downloaded_files
          
          echo "$YT_COOKIES" > cookies.txt
          
          echo "🌐 Starting download for: $URL"
          
          if [[ "$URL" =~ (youtube\.com|youtu\.be|instagram\.com|facebook\.com|twitter\.com) ]]; then
            # Yahan cookies ke sath 'android' client ki trick bhi wapas laga di hai
            BASE_ARGS="--force-ipv4 --cookies cookies.txt --extractor-args youtube:player_client=android,web"
            
            if [ "$QUALITY" == "4k" ]; then
              yt-dlp $BASE_ARGS -f "bv*[height<=2160]+ba/b[height<=2160] / best" "$URL"
            elif [ "$QUALITY" == "1080p" ]; then
              yt-dlp $BASE_ARGS -f "bv*[height<=1080]+ba/b[height<=1080] / best" "$URL"
            elif [ "$QUALITY" == "audio-only" ]; then
              yt-dlp $BASE_ARGS -x --audio-format mp3 "$URL"
            else
              yt-dlp $BASE_ARGS -f "bestvideo+bestaudio/best" "$URL"
            fi
          else
            curl -L -O -J "$URL"
          fi
          
          rm -f cookies.txt
          
          if [ -z "$(ls -A)" ]; then exit 1; fi

      - name: Security Check
        run: |
          cd downloaded_files
          clamscan -r --infected --no-summary .
          if [ $? -eq 1 ]; then exit 1; fi

      - name: Generate Download Link
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Downloaded-File
          path: downloaded_files/*
          retention-days: 1
          
