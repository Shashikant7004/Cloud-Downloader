name: Cloud Universal Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link dalen (YouTube, Insta, APK, PDF, etc.)'
        required: true
        type: string
      quality:
        description: 'Quality (Sirf Videos ke liye)'
        required: true
        default: 'best'
        type: choice
        options:
          - 'best'
          - '4k'
          - '1080p'
          - '720p'
          - 'audio-only'

jobs:
  Secure-Download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (JS Challenge Solver ke liye)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache ClamAV Database (Super Speed + Full Security)
        uses: actions/cache@v4
        with:
          path: /var/lib/clamav
          key: clamav-database-${{ github.run_id }}
          restore-keys: |
            clamav-database-

      - name: Install Dependencies & Master yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg clamav curl python3-pip
          pip install -U https://github.com/yt-dlp/yt-dlp/archive/master.zip
          
          # Agar cache mein database nahi mila, tabhi freshclam chalega warna skip ho jayega
          if [ ! -f /var/lib/clamav/main.cvd ] && [ ! -f /var/lib/clamav/main.cld ]; then
            echo "📥 Downloading fresh virus definitions..."
            sudo freshclam || true
          else
            echo "⚡ Using cached virus definitions (Super Fast!)"
          fi

      - name: Download Media / File
        id: download_step
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          
          mkdir downloaded_files
          cd downloaded_files
          
          echo "$YT_COOKIES" > cookies.txt
          
          echo "🌐 Starting download for: $URL"
          
          if [[ "$URL" =~ (youtube\.com|youtu\.be|instagram\.com|facebook\.com|twitter\.com) ]]; then
            BASE_ARGS="--rm-cache-dir --force-ipv4 --cookies cookies.txt"
            
            if [ "$QUALITY" == "4k" ]; then
              yt-dlp $BASE_ARGS -f "bv*[height<=2160]+ba/b[height<=2160] / best" "$URL"
            elif [ "$QUALITY" == "1080p" ]; then
              yt-dlp $BASE_ARGS -f "bv*[height<=1080]+ba/b[height<=1080] / best" "$URL"
            elif [ "$QUALITY" == "audio-only" ]; then
              yt-dlp $BASE_ARGS -x --audio-format mp3 "$URL"
            else
              yt-dlp $BASE_ARGS -f "bestvideo+bestaudio/best" "$URL"
            fi
          else
            curl -L -O -J "$URL"
          fi
          
          rm -f cookies.txt
          
          if [ -z "$(ls -A)" ]; then exit 1; fi

      - name: Security Check
        run: |
          cd downloaded_files
          clamscan -r --infected --no-summary .
          if [ $? -eq 1 ]; then exit 1; fi

      - name: Generate Download Link
        uses: actions/upload-artifact@v4
        with:
          name: Clean-Downloaded-File
          path: downloaded_files/*
          retention-days: 1
          
