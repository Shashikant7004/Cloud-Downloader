name: Smart Cloud Engine
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL'
        required: true

jobs:
  Secure-Fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fast Boot (Tools Setup)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav ffmpeg > /dev/null
          sudo freshclam --quiet || true
          pip install -U -q yt-dlp

      - name: Process & Scan
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          mkdir vault
          cd vault
          
          if [[ "$TARGET_URL" == *"youtube.com"* || "$TARGET_URL" == *"youtu.be"* || "$TARGET_URL" == *"instagram.com"* ]]; then
            echo "Downloading Media..."
            # Pehle best quality try karega, fail hone par normal quality download karega
            yt-dlp -f "bv*+ba/b" --merge-output-format mp4 "$TARGET_URL" || yt-dlp -f "b" "$TARGET_URL"
          else
            echo "Downloading File & Scanning..."
            curl -sL -O "$TARGET_URL"
            clamscan --no-summary ./* || exit 1
          fi

      - name: Export Secure Payload
        uses: actions/upload-artifact@v4
        with:
          name: Secure-Vault
          path: vault/*
          retention-days: 1
          
          
